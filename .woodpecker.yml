# marschat-components 发包流水线（R3 · Phase 2）
# 四包同批：java/common-core + java/auth-core（mvn deploy）→ packages/auth-components + packages/frontend-common（npm publish）
# 触发：push main 自动；版本号在各 pom/package.json 中维护，本流水线只做「构建 + 发版」。
# 前置 secrets（Woodpecker Repo 5）：nexus_user / nexus_pass（Nexus admin 凭据）
# ⚠️ 教训（#1 实测）：① maven deploy 401 = secrets 配错/后配；② commands 数组的 && 链
#    在 mvn 失败后短路，后续相对路径 cd 全部落空——多包部署必须拆独立 step。
# ⚠️ 教训（#12/#13 实测）：maven 依赖下载走公网 nexus.marschat.online（绕腾讯云2号）速度 11~436kB/s，
#    200MB 依赖永远跑不完被 kill。修复（本机实测 850kB/s + 缓存命中秒级）：
#    ① settings.xml 加内网 mirror（runner 与 Nexus 同机 192.168.31.105）；
#    ② 挂宿主 /root/.m2-cache/marschat 持久缓存卷（repo trusted.volumes=true）。
#    deploy 上传仍走 pom 的 distributionManagement（https 公网，jar 小无影响；mirror 不作用于 deploy）。

when:
  - event: push
    branch: main
  - event: manual

steps:
  - name: maven-deploy-common-core
    image: maven:3.9-eclipse-temurin-21
    # 同版本重发会被 Nexus 拒 400（redeploy not allowed）——maven 发版已在 #7 验证成功，
    # 此处 ignore 让后续 npm 步骤得以验证
    failure: ignore
    environment:
      NEXUS_USER:
        from_secret: nexus_user
      NEXUS_PASS:
        from_secret: nexus_pass
    volumes:
      - /root/.m2-cache/marschat:/root/.m2/repository
    commands:
      - mkdir -p /root/.m2
      - echo "<settings><mirrors><mirror><id>nexus-internal</id><mirrorOf>*</mirrorOf><url>http://192.168.31.105:8081/repository/maven-public/</url></mirror></mirrors><servers><server><id>nexus-releases</id><username>$${NEXUS_USER}</username><password>$${NEXUS_PASS}</password></server><server><id>nexus-snapshots</id><username>$${NEXUS_USER}</username><password>$${NEXUS_PASS}</password></server></servers></settings>" > /root/.m2/settings.xml
      - cd java/common-core
      - mvn -B deploy -DskipTests

  - name: maven-deploy-auth-core
    image: maven:3.9-eclipse-temurin-21
    failure: ignore
    environment:
      NEXUS_USER:
        from_secret: nexus_user
      NEXUS_PASS:
        from_secret: nexus_pass
    volumes:
      - /root/.m2-cache/marschat:/root/.m2/repository
    commands:
      - mkdir -p /root/.m2
      - echo "<settings><mirrors><mirror><id>nexus-internal</id><mirrorOf>*</mirrorOf><url>http://192.168.31.105:8081/repository/maven-public/</url></mirror></mirrors><servers><server><id>nexus-releases</id><username>$${NEXUS_USER}</username><password>$${NEXUS_PASS}</password></server><server><id>nexus-snapshots</id><username>$${NEXUS_USER}</username><password>$${NEXUS_PASS}</password></server></servers></settings>" > /root/.m2/settings.xml
      - cd java/auth-core
      - mvn -B deploy -DskipTests

  - name: npm-publish-auth-components
    image: node:22-alpine
    environment:
      NEXUS_USER:
        from_secret: nexus_user
      NEXUS_PASS:
        from_secret: nexus_pass
      # ⚠️ corepack 必须指 Nexus，否则 prepare 从 registry.npmjs.org 拉 pnpm 二进制——
      # runner 直连官方源会挂死（§16.15.4 同根因，#7 实测卡 15 分钟）
      COREPACK_NPM_REGISTRY: https://nexus.marschat.online/repository/npm-public/
    commands:
      - export NEXUS_AUTH=$(printf "%s:%s" "$${NEXUS_USER}" "$${NEXUS_PASS}" | base64)
      - cd packages/auth-components
      - corepack enable
      - corepack prepare pnpm@9.15.9 --activate
      - pnpm install --frozen-lockfile --registry https://nexus.marschat.online/repository/npm-public/
      - pnpm build
      - npm publish --registry https://nexus.marschat.online/repository/npm-hosted/ --//nexus.marschat.online/repository/npm-hosted/:_auth=$${NEXUS_AUTH} --//nexus.marschat.online/repository/npm-hosted/:always-auth=true

  - name: npm-publish-frontend-common
    image: node:22-alpine
    environment:
      NEXUS_USER:
        from_secret: nexus_user
      NEXUS_PASS:
        from_secret: nexus_pass
      COREPACK_NPM_REGISTRY: https://nexus.marschat.online/repository/npm-public/
    commands:
      - export NEXUS_AUTH=$(printf "%s:%s" "$${NEXUS_USER}" "$${NEXUS_PASS}" | base64)
      - cd packages/frontend-common
      - corepack enable
      - corepack prepare pnpm@9.15.9 --activate
      # ⚠️ 不能用 npm install——monorepo 根的 husky postinstall 会失败（#10 实测），统一走 pnpm workspace
      - pnpm install --frozen-lockfile --filter @marschat/frontend-common
      - pnpm --filter @marschat/frontend-common build
      - npm publish --registry https://nexus.marschat.online/repository/npm-hosted/ --//nexus.marschat.online/repository/npm-hosted/:_auth=$${NEXUS_AUTH} --//nexus.marschat.online/repository/npm-hosted/:always-auth=true
