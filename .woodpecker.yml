# marschat-components 发包流水线（R3 · Phase 2）
# 四包同批：java/common-core + java/auth-core（mvn deploy）→ packages/auth-components + packages/frontend-common（npm publish）
# 触发：push main 自动；版本号已在各 pom/package.json 中维护，本流水线只做「构建 + 发版 + 校验」。
# 前置 secrets（Woodpecker Repo 5）：
#   nexus_user / nexus_pass   —— Nexus 发布凭据（maven server + npm _auth）
# 环境：Nexus 内网可达（woodpecker runner 在 mykng）
skip_clone: false

when:
  - event: push
    branch: main
  - event: manual

steps:
  - name: restore-keycheck
    image: alpine:3.20
    commands:
      - echo "repo=marschat-components branch=main"
      - grep -q "<version>" java/common-core/pom.xml && grep -q "<version>" java/auth-core/pom.xml

  - name: maven-deploy
    image: maven:3.9-eclipse-temurin-21
    environment:
      NEXUS_USER:
        from_secret: nexus_user
      NEXUS_PASS:
        from_secret: nexus_pass
    commands:
      - mkdir -p /root/.m2
      - |
        cat > /root/.m2/settings.xml <<EOF
        <settings>
          <servers>
            <server><id>nexus-releases</id><username>$${NEXUS_USER}</username><password>$${NEXUS_PASS}</password></server>
            <server><id>nexus-snapshots</id><username>$${NEXUS_USER}</username><password>$${NEXUS_PASS}</password></server>
          </servers>
        </settings>
        EOF
      - cd java/common-core && mvn -B deploy -DskipTests && cd ../..
      - cd java/auth-core && mvn -B deploy -DskipTests

  - name: npm-publish
    image: node:22-alpine
    environment:
      NEXUS_USER:
        from_secret: nexus_user
      NEXUS_PASS:
        from_secret: nexus_pass
    commands:
      - export NEXUS_AUTH=$(printf "%s:%s" "$${NEXUS_USER}" "$${NEXUS_PASS}" | base64)
      - cd packages/auth-components
      - corepack enable && corepack prepare pnpm@9.15.9 --activate
      - pnpm install --frozen-lockfile
      - pnpm build
      - npm publish --registry https://nexus.marschat.online/repository/npm-hosted/ --//nexus.marschat.online/repository/npm-hosted/:_auth=$${NEXUS_AUTH} --//nexus.marschat.online/repository/npm-hosted/:always-auth=true
      - cd ../frontend-common
      - npm install --no-package-lock
      - pnpm build
      - npm publish --registry https://nexus.marschat.online/repository/npm-hosted/ --//nexus.marschat.online/repository/npm-hosted/:_auth=$${NEXUS_AUTH} --//nexus.marschat.online/repository/npm-hosted/:always-auth=true
