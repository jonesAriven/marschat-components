# marschat-components 发包流水线（R3 · Phase 2）
# 四包同批：java/common-core + java/auth-core（mvn deploy）→ packages/auth-components + packages/frontend-common（npm publish）
# 触发：push main 自动；版本号在各 pom/package.json 中维护，本流水线只做「构建 + 发版」。
# 前置 secrets（Woodpecker Repo 5）：nexus_user / nexus_pass（Nexus admin 凭据）
# ⚠️ 教训（#1 实测）：① maven deploy 401 = secrets 配错/后配；② commands 数组的 && 链
#    在 mvn 失败后短路，后续相对路径 cd 全部落空——多包部署必须拆独立 step。
# ⚠️ 教训（#12/#13 实测）：maven 依赖下载走公网 nexus.marschat.online（绕腾讯云2号）速度 11~436kB/s，
#    200MB 依赖永远跑不完被 kill。修复（本机实测 850kB/s + 缓存命中秒级）：
#    ① settings.xml 加内网 mirror（runner 与 Nexus 同机 192.168.31.105）；
#    ② 挂宿主 /root/.m2-cache/marschat 持久缓存卷（repo trusted.volumes=true）。
# ⚠️ 教训（#15/#16/#17 + 良哥 2026-09-13 纠正）：
#    ① 同版本重跑必 400 红叉（maven-releases 禁 redeploy）——failure:ignore 吞掉后 pipeline 假绿，
#      步骤级全是 failure。修复=deploy/publish 前查内网 Nexus 版本已存在则幂等跳过，去掉 ignore；
#    ② deploy 上传/npm registry 曾绕公网域名——同机传输一律走 http://192.168.31.105:8081
#      （pom distributionManagement 已同步改 IP；mirror 不作用于 deploy，distributionManagement 不受 http blocker 限制）。

when:
  - event: push
    branch: main
  - event: manual

steps:
  # ⚠️ 幂等语义（#15/#16/#17 教训）：Nexus maven-releases 禁同版本重发，重跑流水线
  #    必 400 红叉（failure:ignore 吞掉后 pipeline 假绿）。改为 deploy 前查内网 Nexus
  #    该版本是否已存在：存在→幂等跳过（步骤 success 无红叉），不存在→真正 deploy。
  #    去掉 failure: ignore——真失败显性红，且 fail-fast 阻断后续步骤。
  # ⚠️ 全链内网 IP（良哥 2026-09-13 纠正）：runner 与 Nexus 同在 mykng，下载 mirror /
  #    deploy 上传 / npm registry 一律 http://192.168.31.105:8081，禁止绕公网域名
  #    （容器→公网DNS→腾讯云2号 nginx→回 mykng 的环，受 3Mbps EIP 限制）。
  - name: maven-deploy-common-core
    image: maven:3.9-eclipse-temurin-21
    environment:
      NEXUS_USER:
        from_secret: nexus_user
      NEXUS_PASS:
        from_secret: nexus_pass
    volumes:
      - /root/.m2-cache/marschat:/root/.m2/repository
    commands:
      - mkdir -p /root/.m2
      - echo "<settings><mirrors><mirror><id>nexus-internal</id><mirrorOf>*</mirrorOf><url>http://192.168.31.105:8081/repository/maven-public/</url></mirror></mirrors><servers><server><id>nexus-releases</id><username>$${NEXUS_USER}</username><password>$${NEXUS_PASS}</password></server><server><id>nexus-snapshots</id><username>$${NEXUS_USER}</username><password>$${NEXUS_PASS}</password></server></servers></settings>" > /root/.m2/settings.xml
      - cd java/common-core
      - VER=$$(grep -A1 '<artifactId>common-core</artifactId>' pom.xml | grep -m1 '<version>' | sed 's/.*<version>//;s/<\/version>.*//')
      - echo "构建版本: $$VER"
      - if curl -sf -o /dev/null "http://192.168.31.105:8081/repository/maven-releases/com/marschat/common-core/$$VER/common-core-$$VER.pom"; then echo "版本 $$VER 已在 Nexus，幂等跳过 deploy"; else mvn -B deploy -DskipTests; fi

  - name: maven-deploy-auth-core
    image: maven:3.9-eclipse-temurin-21
    environment:
      NEXUS_USER:
        from_secret: nexus_user
      NEXUS_PASS:
        from_secret: nexus_pass
    volumes:
      - /root/.m2-cache/marschat:/root/.m2/repository
    commands:
      - mkdir -p /root/.m2
      - echo "<settings><mirrors><mirror><id>nexus-internal</id><mirrorOf>*</mirrorOf><url>http://192.168.31.105:8081/repository/maven-public/</url></mirror></mirrors><servers><server><id>nexus-releases</id><username>$${NEXUS_USER}</username><password>$${NEXUS_PASS}</password></server><server><id>nexus-snapshots</id><username>$${NEXUS_USER}</username><password>$${NEXUS_PASS}</password></server></servers></settings>" > /root/.m2/settings.xml
      - cd java/auth-core
      - VER=$$(grep -A1 '<artifactId>auth-core</artifactId>' pom.xml | grep -m1 '<version>' | sed 's/.*<version>//;s/<\/version>.*//')
      - echo "构建版本: $$VER"
      - if curl -sf -o /dev/null "http://192.168.31.105:8081/repository/maven-releases/com/marschat/auth-core/$$VER/auth-core-$$VER.pom"; then echo "版本 $$VER 已在 Nexus，幂等跳过 deploy"; else mvn -B deploy -DskipTests; fi

  - name: npm-publish-auth-components
    image: node:22-alpine
    environment:
      NEXUS_USER:
        from_secret: nexus_user
      NEXUS_PASS:
        from_secret: nexus_pass
      # ⚠️ corepack 必须指内网 Nexus，否则 prepare 从 registry.npmjs.org 拉 pnpm 二进制挂死
      COREPACK_NPM_REGISTRY: http://192.168.31.105:8081/repository/npm-public/
    commands:
      - export NEXUS_AUTH=$(printf "%s:%s" "$${NEXUS_USER}" "$${NEXUS_PASS}" | base64)
      - cd packages/auth-components
      - VER=$$(node -p "require('./package.json').version")
      - echo "构建版本: $$VER"
      - if curl -sf "http://192.168.31.105:8081/repository/npm-hosted/@marschat/auth-components" | grep -q "\"$$VER\""; then echo "版本 $$VER 已在 Nexus，幂等跳过 publish"; exit 0; fi
      - corepack enable
      - corepack prepare pnpm@9.15.9 --activate
      - pnpm install --frozen-lockfile --registry http://192.168.31.105:8081/repository/npm-public/
      - pnpm build
      - npm publish --registry http://192.168.31.105:8081/repository/npm-hosted/ --//192.168.31.105:8081/repository/npm-hosted/:_auth=$${NEXUS_AUTH} --//192.168.31.105:8081/repository/npm-hosted/:always-auth=true

  - name: npm-publish-frontend-common
    image: node:22-alpine
    environment:
      NEXUS_USER:
        from_secret: nexus_user
      NEXUS_PASS:
        from_secret: nexus_pass
      COREPACK_NPM_REGISTRY: http://192.168.31.105:8081/repository/npm-public/
    commands:
      - export NEXUS_AUTH=$(printf "%s:%s" "$${NEXUS_USER}" "$${NEXUS_PASS}" | base64)
      - cd packages/frontend-common
      - VER=$$(node -p "require('./package.json').version")
      - echo "构建版本: $$VER"
      - if curl -sf "http://192.168.31.105:8081/repository/npm-hosted/@marschat/frontend-common" | grep -q "\"$$VER\""; then echo "版本 $$VER 已在 Nexus，幂等跳过 publish"; exit 0; fi
      - corepack enable
      - corepack prepare pnpm@9.15.9 --activate
      # ⚠️ 不能用 npm install——monorepo 根的 husky postinstall 会失败（#10 实测），统一走 pnpm workspace
      - pnpm install --frozen-lockfile --filter @marschat/frontend-common --registry http://192.168.31.105:8081/repository/npm-public/
      - pnpm --filter @marschat/frontend-common build
      - npm publish --registry http://192.168.31.105:8081/repository/npm-hosted/ --//192.168.31.105:8081/repository/npm-hosted/:_auth=$${NEXUS_AUTH} --//192.168.31.105:8081/repository/npm-hosted/:always-auth=true
